name: Static checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate static site files
        run: node scripts/validate-static.js

      - name: Install backend dependencies
        working-directory: WETHUS2/backend
        run: npm ci

      - name: Backend syntax check
        run: node --check WETHUS2/backend/server.js

      - name: Backend security smoke
        run: node scripts/smoke-backend-security.js
