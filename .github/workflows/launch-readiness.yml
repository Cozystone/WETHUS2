name: Launch readiness

on:
  workflow_dispatch:
  schedule:
    - cron: '45 1 * * *'

jobs:
  launch-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: WETHUS2/backend
        run: npm ci

      - name: Generate launch-readiness evidence files
        run: node scripts/generate-launch-readiness-artifacts.js

      - name: Run strict launch-grade commercialization gate
        env:
          WETHUS_GATE_STRICT_PRODUCTION: 'true'
          REQUIRE_WETHUS_API_SECURITY_HEADERS: 'true'
          REQUIRE_WETHUS_API_HEALTH_METADATA: 'true'
          REQUIRE_WETHUS_API_SECURITY_FLAGS: 'true'
          REQUIRE_WETHUS_BACKEND_CONTRACTS: 'true'
          REQUIRE_WETHUS_FRONTEND_HUB_CONTRACTS: 'true'
        run: node scripts/run-commercial-gate.js

      - name: Publish launch-readiness workflow summary
        if: always()
        run: node scripts/write-launch-readiness-step-summary.js

      - name: Upload launch-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-readiness-evidence
          path: |
            commercialization-readiness-summary.txt
            commercialization-readiness-summary.json
            production-rollout-status.txt
            production-rollout-status.json
            launch-readiness-snapshot.md
            launch-readiness-snapshot.json
