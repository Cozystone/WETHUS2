<!DOCTYPE html>
<html lang="ko">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PKF58GJC08"></script>
  <script>
   window.dataLayer = window.dataLayer || [];
   function gtag(){dataLayer.push(arguments);}
   gtag('js', new Date());
   gtag('config', 'G-PKF58GJC08');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WETHUS | 관리자 검토</title>
  <link rel="stylesheet" href="styles.css?v=20260419-25" />
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="wordmark">WETHUS</a>
      <nav class="nav-links"><a href="index.html" class="nav-link">홈</a></nav>
    </div>
  </header>

  <main class="container page-main page-main--standard">
    <section class="page-header">
      <h1 class="page-title">관리자 수동 검토</h1>
      <p class="page-sub">AI가 검토를 요청한 프로젝트를 승인하거나 반려하세요.</p>
    </section>
    <section id="reviewList" class="list-grid"></section>
  </main>

  <script src="app.js?v=20260625-admin-review-api"></script>
  <script>
    (function(){
      const list = document.getElementById('reviewList');
      const st = WETHUS.getState();
      const actor = st.currentUserId || (st.devMode ? 'dev-temp' : null);
      let remoteMode = true;

      const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));

      if (!actor) {
        location.href = 'login.html';
        return;
      }

      if (!WETHUS.isAdminActor()) {
        list.innerHTML = '<article class="list-item"><h3>권한 없음</h3><p>관리자 계정에서만 접근할 수 있습니다.</p></article>';
        return;
      }

      async function loadItems() {
        if (remoteMode && WETHUS.listRemoteReviewProjects) {
          try {
            return await WETHUS.listRemoteReviewProjects();
          } catch (_) {
            remoteMode = false;
          }
        }
        return WETHUS.listReviewProjects();
      }

      async function render() {
        const items = await loadItems();
        if (!items.length) {
          list.innerHTML = '<article class="list-item"><h3>검토 대기 없음</h3><p>현재 수동 검토가 필요한 프로젝트가 없습니다.</p></article>';
          return;
        }

        list.innerHTML = items.map((project) => `
          <article class="list-item" data-id="${esc(project.id)}">
            <h3>${esc(project.title)}</h3>
            <p>${esc(project.summary || '')}</p>
            <p class="meta">카테고리: ${esc(project.category || '-')} · 상태: ${esc(project.moderationStatus || project.status || '-')} · 신청자: ${esc(project.founderId || '-')}</p>
            <p style="white-space:pre-wrap;color:#bdbdbd;">${esc((project.fullDescription || '').slice(0, 400))}</p>
            <div style="display:flex;gap:8px;justify-content:flex-end;">
              <button class="btn btn--secondary js-reject">반려</button>
              <button class="btn btn--primary js-approve">승인</button>
            </div>
          </article>
        `).join('');
      }

      async function applyDecision(projectId, decision, note) {
        if (remoteMode && WETHUS.reviewProjectRemote) {
          try {
            await WETHUS.reviewProjectRemote(projectId, decision, note);
            return;
          } catch (_) {
            remoteMode = false;
          }
        }
        WETHUS.reviewProject(projectId, decision, note);
      }

      list.addEventListener('click', async (event) => {
        const card = event.target.closest('[data-id]');
        if (!card) return;
        const id = card.getAttribute('data-id');

        if (event.target.closest('.js-approve')) {
          await applyDecision(id, 'approve', '운영자 승인');
          render();
          return;
        }

        if (event.target.closest('.js-reject')) {
          const reason = prompt('반려 사유를 입력하세요.', '운영자 검토 결과 반려');
          if (reason == null) return;
          await applyDecision(id, 'reject', reason);
          render();
        }
      });

      const me = WETHUS.currentUser && WETHUS.currentUser();
      if (me?.email && WETHUS.syncCloudState) {
        WETHUS.syncCloudState(me.email).catch(() => {}).finally(() => render());
        setTimeout(() => render(), 1200);
      }

      render();
    })();
  </script>
</body>
</html>
