<!DOCTYPE html>
<html lang="ko">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PKF58GJC08"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="wethus-frontend-contract" content="2026-06-26-commercial-interactions-v1" />
  <title>WETHUS | 관리자 운영 검토</title>
  <link rel="stylesheet" href="styles.css?v=20260419-25" />
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="wordmark">WETHUS</a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">홈</a>
        <a href="notifications.html" class="nav-link">알림</a>
      </nav>
    </div>
  </header>

  <main class="container page-main page-main--standard">
    <section class="page-header">
      <h1 class="page-title">관리자 운영 검토</h1>
      <p class="page-sub">프로젝트 수동 검수와 플랜 업그레이드 요청을 같은 화면에서 안전하게 처리합니다.</p>
    </section>

    <section id="opsSummary" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:24px;"></section>
    <p id="opsActionStatus" class="meta" style="margin:-8px 0 24px;color:#bdbdbd;" aria-live="polite"></p>

    <section style="margin-bottom:24px;">
      <div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:10px;">
        <div>
          <h2 style="margin:0 0 4px;">플랜 업그레이드 요청</h2>
          <p class="page-sub" style="margin:0;">Premium, Pro, Master 요청을 검토하고 사용자 계정 상태에 반영합니다.</p>
        </div>
      </div>
      <section id="planRequestList" class="list-grid"></section>
    </section>

    <section>
      <div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:10px;">
        <div>
          <h2 style="margin:0 0 4px;">프로젝트 수동 검수</h2>
          <p class="page-sub" style="margin:0;">AI가 추가 검토를 요청한 프로젝트를 승인 또는 반려합니다.</p>
        </div>
      </div>
      <section id="reviewList" class="list-grid"></section>
    </section>
  </main>

  <script src="app.js?v=20260625-admin-ops-review"></script>
  <script>
    (function () {
      const projectList = document.getElementById('reviewList');
      const planList = document.getElementById('planRequestList');
      const summaryEl = document.getElementById('opsSummary');
      const actionStatusEl = document.getElementById('opsActionStatus');
      const st = WETHUS.getState();
      const actor = st.currentUserId || (st.devMode ? 'dev-temp' : null);
      let remoteMode = true;

      const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
      const formatDate = (value) => {
        const date = new Date(value || Date.now());
        return Number.isNaN(date.getTime()) ? '-' : date.toLocaleString('ko-KR');
      };
      const setActionStatus = (message, tone = '#bdbdbd') => {
        if (!actionStatusEl) return;
        actionStatusEl.textContent = String(message || '').trim();
        actionStatusEl.style.color = tone;
      };
      const setCardBusy = (card, busy, message) => {
        if (!card) return;
        card.dataset.busy = busy ? 'true' : 'false';
        card.querySelectorAll('button').forEach((button) => {
          button.disabled = !!busy;
          button.style.opacity = busy ? '0.65' : '';
          button.style.cursor = busy ? 'wait' : '';
        });
        const statusEl = card.querySelector('.js-card-status');
        if (statusEl) {
          statusEl.textContent = message || '';
          statusEl.style.color = busy ? '#ffb36b' : '#bdbdbd';
        }
      };
      const inlineReviewBox = () => `
        <div style="display:grid;gap:8px;margin-top:10px;">
          <textarea class="js-review-note" style="width:100%;min-height:88px;background:#101010;color:#f5f5f5;border:1px solid #2a2a2a;border-radius:10px;padding:10px;" placeholder="검토 메모를 남기세요. 승인 기준, 반려 사유, 후속 조치를 함께 기록하면 운영 이력이 더 선명해집니다."></textarea>
          <p class="meta" style="margin:0;">이 메모는 승인/반려 사유로 바로 반영됩니다.</p>
          <p class="meta js-card-status" style="margin:0;color:#bdbdbd;" aria-live="polite"></p>
        </div>
      `;

      if (!actor) {
        location.href = 'login.html';
        return;
      }

      if (!WETHUS.isAdminActor()) {
        const denied = '<article class="list-item"><h3>권한 없음</h3><p>관리자 계정에서만 접근할 수 있습니다.</p></article>';
        projectList.innerHTML = denied;
        planList.innerHTML = denied;
        summaryEl.innerHTML = denied;
        return;
      }

      async function loadProjectReviewItems() {
        if (remoteMode && WETHUS.listRemoteReviewProjects) {
          try {
            return await WETHUS.listRemoteReviewProjects();
          } catch (_) {
            remoteMode = false;
          }
        }
        return WETHUS.listReviewProjects();
      }

      async function loadPlanRequests() {
        if (WETHUS.listRemotePlanRequests) {
          try {
            return await WETHUS.listRemotePlanRequests({ admin: true });
          } catch (_) {}
        }
        return WETHUS.listPlanRequests({ mineOnly: false });
      }

      function renderSummary(planRequests, projectItems) {
        const pendingPlan = planRequests.filter((request) => String(request?.status || '') === 'pending').length;
        const pendingProjects = projectItems.length;
        const approvedPlan = planRequests.filter((request) => String(request?.status || '') === 'approved').length;
        const rejectedPlan = planRequests.filter((request) => String(request?.status || '') === 'rejected').length;
        const cards = [
          { label: '플랜 검토 대기', value: pendingPlan, tone: '#7dc4ff' },
          { label: '프로젝트 검토 대기', value: pendingProjects, tone: '#6fdc8c' },
          { label: '플랜 승인 누적', value: approvedPlan, tone: '#ffb36b' },
          { label: '플랜 반려 누적', value: rejectedPlan, tone: '#ff8a80' }
        ];
        summaryEl.innerHTML = cards.map((card) => `
          <article class="list-item" style="padding:14px;border-color:${card.tone};background:rgba(255,255,255,.03);">
            <p class="meta" style="margin:0 0 6px;">${esc(card.label)}</p>
            <strong style="font-size:1.35rem;">${esc(card.value)}</strong>
          </article>
        `).join('');
      }

      function renderPlanRequests(planRequests) {
        const requests = planRequests.slice().sort((a, b) => {
          const aPending = String(a?.status || '') === 'pending' ? 0 : 1;
          const bPending = String(b?.status || '') === 'pending' ? 0 : 1;
          if (aPending !== bPending) return aPending - bPending;
          return new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0);
        }).slice(0, 40);

        if (!requests.length) {
          planList.innerHTML = '<article class="list-item"><h3>요청 없음</h3><p>아직 접수된 플랜 업그레이드 요청이 없습니다.</p></article>';
          return;
        }

        planList.innerHTML = requests.map((request) => {
          const pending = String(request?.status || '') === 'pending';
          const statusLabel = pending ? '검토 대기' : (request.status === 'approved' ? '승인됨' : '반려됨');
          const reviewMeta = request.reviewedAt
            ? ` · 처리: ${formatDate(request.reviewedAt)}${request.reviewedBy ? ` · ${esc(request.reviewedBy)}` : ''}`
            : '';
          const noteLine = request.note ? `<p style="white-space:pre-wrap;color:#bdbdbd;">요청 메모: ${esc(request.note)}</p>` : '';
          const reviewLine = request.reviewNote ? `<p class="meta">검토 메모: ${esc(request.reviewNote)}</p>` : '';
          const appliedLine = request.appliedPlan ? `<p class="meta">반영 플랜: ${esc(String(request.appliedPlan || '').toUpperCase())}</p>` : '';
          const actions = pending
            ? `<div style="display:grid;gap:8px;">
                ${inlineReviewBox()}
                <div style="display:flex;gap:8px;justify-content:flex-end;">
                  <button class="btn btn--secondary js-plan-reject" type="button">반려</button>
                  <button class="btn btn--primary js-plan-approve" type="button">승인</button>
                </div>
              </div>`
            : '';
          return `
            <article class="list-item" data-plan-request-id="${esc(request.id)}">
              <h3>${esc(String(request.requestedPlan || '').toUpperCase())} 요청</h3>
              <p>${esc(request.userName || '사용자')} · ${esc(request.userEmail || '이메일 없음')}</p>
              <p class="meta">현재 플랜: ${esc(String(request.currentPlan || 'free').toUpperCase())} · 상태: ${esc(statusLabel)} · 접수: ${esc(formatDate(request.createdAt))}${reviewMeta}</p>
              ${noteLine}
              ${reviewLine}
              ${appliedLine}
              ${actions}
            </article>
          `;
        }).join('');
      }

      function renderProjects(projectItems) {
        if (!projectItems.length) {
          projectList.innerHTML = '<article class="list-item"><h3>검토 대기 없음</h3><p>현재 수동 검수가 필요한 프로젝트가 없습니다.</p></article>';
          return;
        }

        projectList.innerHTML = projectItems.map((project) => `
          <article class="list-item" data-project-id="${esc(project.id)}">
            <h3>${esc(project.title)}</h3>
            <p>${esc(project.summary || '')}</p>
            <p class="meta">카테고리: ${esc(project.category || '-')} · 상태: ${esc(project.moderationStatus || project.status || '-')} · 요청자: ${esc(project.founderId || '-')}</p>
            <p class="meta">생성: ${esc(formatDate(project.createdAt || project.updatedAt))}${project.moderationReason ? ` · AI 사유: ${esc(project.moderationReason)}` : ''}</p>
            <p style="white-space:pre-wrap;color:#bdbdbd;">${esc((project.fullDescription || '').slice(0, 400))}</p>
            <div style="display:grid;gap:8px;">
              ${inlineReviewBox()}
              <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button class="btn btn--secondary js-project-reject" type="button">반려</button>
                <button class="btn btn--primary js-project-approve" type="button">승인</button>
              </div>
            </div>
          </article>
        `).join('');
      }

      function readReviewNote(card, fallback) {
        return String(card?.querySelector('.js-review-note')?.value || '').trim() || fallback;
      }

      async function renderAll() {
        const projectItems = await loadProjectReviewItems();
        const planRequests = await loadPlanRequests();
        renderSummary(planRequests, projectItems);
        renderPlanRequests(planRequests);
        renderProjects(projectItems);
      }

      async function applyProjectDecision(projectId, decision, note) {
        if (remoteMode && WETHUS.reviewProjectRemote) {
          try {
            await WETHUS.reviewProjectRemote(projectId, decision, note);
            return;
          } catch (_) {
            remoteMode = false;
          }
        }
        WETHUS.reviewProject(projectId, decision, note);
      }

      projectList.addEventListener('click', async (event) => {
        const card = event.target.closest('[data-project-id]');
        if (!card) return;
        if (card.dataset.busy === 'true') return;
        const id = card.getAttribute('data-project-id');

        if (event.target.closest('.js-project-approve')) {
          const note = readReviewNote(card, '운영팀 승인');
          try {
            setCardBusy(card, true, '승인 처리 중...');
            setActionStatus('프로젝트 승인을 처리하고 있습니다...', '#ffb36b');
            await applyProjectDecision(id, 'approve', note);
            setActionStatus('프로젝트 승인이 반영되었습니다.', '#6fdc8c');
            await renderAll();
          } catch (error) {
            setCardBusy(card, false, '승인 처리 실패. 잠시 후 다시 시도하세요.');
            setActionStatus(`프로젝트 승인 실패: ${error?.message || '알 수 없는 오류'}`, '#ff8a80');
          }
          return;
        }

        if (event.target.closest('.js-project-reject')) {
          const note = readReviewNote(card, '운영 검토 결과 반려');
          try {
            setCardBusy(card, true, '반려 처리 중...');
            setActionStatus('프로젝트 반려를 처리하고 있습니다...', '#ffb36b');
            await applyProjectDecision(id, 'reject', note);
            setActionStatus('프로젝트 반려가 반영되었습니다.', '#6fdc8c');
            await renderAll();
          } catch (error) {
            setCardBusy(card, false, '반려 처리 실패. 잠시 후 다시 시도하세요.');
            setActionStatus(`프로젝트 반려 실패: ${error?.message || '알 수 없는 오류'}`, '#ff8a80');
          }
        }
      });

      planList.addEventListener('click', async (event) => {
        const card = event.target.closest('[data-plan-request-id]');
        if (!card) return;
        if (card.dataset.busy === 'true') return;
        const id = card.getAttribute('data-plan-request-id');

        if (event.target.closest('.js-plan-approve')) {
          const note = readReviewNote(card, '운영 검토 후 승인');
          try {
            setCardBusy(card, true, '플랜 승인 처리 중...');
            setActionStatus('플랜 업그레이드 승인을 처리하고 있습니다...', '#ffb36b');
            if (WETHUS.reviewPlanRequestRemote) {
              try {
                await WETHUS.reviewPlanRequestRemote(id, 'approve', note);
              } catch (_) {
                WETHUS.reviewPlanRequest(id, 'approve', note);
              }
            } else {
              WETHUS.reviewPlanRequest(id, 'approve', note);
            }
            setActionStatus('플랜 업그레이드 승인이 반영되었습니다.', '#6fdc8c');
            await renderAll();
          } catch (error) {
            setCardBusy(card, false, '플랜 승인 처리 실패. 잠시 후 다시 시도하세요.');
            setActionStatus(`플랜 승인 실패: ${error?.message || '알 수 없는 오류'}`, '#ff8a80');
          }
          return;
        }

        if (event.target.closest('.js-plan-reject')) {
          const note = readReviewNote(card, '현재 운영 기준과 맞지 않아 반려합니다.');
          try {
            setCardBusy(card, true, '플랜 반려 처리 중...');
            setActionStatus('플랜 업그레이드 반려를 처리하고 있습니다...', '#ffb36b');
            if (WETHUS.reviewPlanRequestRemote) {
              try {
                await WETHUS.reviewPlanRequestRemote(id, 'reject', note);
              } catch (_) {
                WETHUS.reviewPlanRequest(id, 'reject', note);
              }
            } else {
              WETHUS.reviewPlanRequest(id, 'reject', note);
            }
            setActionStatus('플랜 업그레이드 반려가 반영되었습니다.', '#6fdc8c');
            await renderAll();
          } catch (error) {
            setCardBusy(card, false, '플랜 반려 처리 실패. 잠시 후 다시 시도하세요.');
            setActionStatus(`플랜 반려 실패: ${error?.message || '알 수 없는 오류'}`, '#ff8a80');
          }
        }
      });

      const me = WETHUS.currentUser && WETHUS.currentUser();
      if (me?.email && WETHUS.syncCloudState) {
        WETHUS.syncCloudState(me.email).catch(() => {}).finally(() => renderAll());
        setTimeout(() => renderAll(), 1200);
      }

      renderAll();
    })();
  </script>
</body>
</html>
