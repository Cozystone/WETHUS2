<!DOCTYPE html>
<html lang="ko">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PKF58GJC08"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PKF58GJC08');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WETHUS | 알림</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/variable/pretendardvariable.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css?v=20260419-25" />
  <style>
    .notify-summary-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .notify-summary-card { padding:12px; background:rgba(255,255,255,.03); border-radius:14px; }
    .notify-card { cursor:pointer; }
    .notify-card-body { margin:0 0 4px; color:#d8d8d8; line-height:1.5; font-size:.86rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .notify-empty-card { display:grid; gap:6px; }
    .notify-filter-meta { margin:2px 0 0; color:#9f9f9f; font-size:.84rem; line-height:1.5; }
    .notify-filter-grid { display:flex; gap:8px; flex-wrap:wrap; }
    .notify-filter-chip { min-height:36px; padding:6px 11px; border-radius:999px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.035); color:#e8e8e8; font-size:.82rem; font-weight:700; cursor:pointer; }
    .notify-filter-chip.active { border-color:rgba(255,106,0,.58); background:rgba(255,106,0,.12); color:#fff1e3; }
    .notify-card-shell { gap:8px !important; }
    .notify-card-title { margin:0 0 2px; font-size:1rem; line-height:1.32; }
    .notify-card-meta { margin:0 0 6px; color:var(--orange); font-size:.8rem; font-weight:700; }
    .notify-card-time { font-size:.78rem; }
    .notify-card-actions .btn,
    .notify-card-actions .verify-badge { min-height:32px; }
    @media (max-width: 720px) {
      .notify-summary-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .notify-summary-card { padding:12px; }
      .notify-summary-card strong { font-size:1.15rem !important; }
      .notify-card-top { flex-direction:column; }
      .notify-card-actions { width:100%; justify-content:flex-start !important; }
      .notify-filter-grid { gap:7px; }
      .notify-filter-chip { min-height:34px; padding:6px 10px; font-size:.8rem; }
      .notify-card-body { -webkit-line-clamp:2; font-size:.84rem; }
    }
    @media (max-width: 520px) {
      .notify-summary-grid { grid-template-columns:1fr; gap:8px; }
      .notify-summary-card { padding:11px 12px; }
      .notify-filter-grid { gap:6px; }
      .notify-filter-chip { min-height:33px; font-size:.78rem; }
      #markAllRead { width:100%; justify-content:center; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="wordmark">WETHUS</a>
      <nav class="nav-links">
        <a href="explore.html" class="nav-link">탐색</a>
        <a href="founder.html" class="nav-link">프로젝트 시작하기</a>
        <a href="project-hub.html" class="nav-link">프로젝트 허브</a>
        <a href="mentor.html" class="nav-link">멘토</a>
        <a href="profile.html" class="nav-link">프로필</a>
        <a href="login.html" class="nav-link js-auth-link">로그인</a>
      </nav>
    </div>
  </header>

  <main class="container page-main page-main--standard">
    <section class="projects-head-row" style="padding-top:28px;">
      <div>
        <h1 class="page-title" style="margin:0;">알림</h1>
        <p class="page-sub">플랜, 검토, 팀 상태 변화를 빠르게 봅니다.</p>
      </div>
      <button id="markAllRead" class="btn btn--secondary" type="button">모두 읽음 처리</button>
    </section>

    <section style="display:grid;gap:12px;margin-bottom:14px;">
      <div id="notifySummary" class="notify-summary-grid"></div>
      <p id="notifyFilterMeta" class="notify-filter-meta"></p>
      <div id="notifyFilters" class="notify-filter-grid"></div>
    </section>

    <section id="notifyList" class="list-grid"></section>
  </main>

  <div id="notifyDetailModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-notify="true"></div>
    <article class="modal-panel" style="max-width:560px;">
      <button class="modal-close" id="notifyDetailClose" aria-label="닫기">×</button>
      <div class="modal-content">
        <p class="section-kicker" id="notifyDetailType">NOTIFICATION</p>
        <h3 id="notifyDetailTitle" style="margin:0 0 8px;font-size:1.2rem;"></h3>
        <p id="notifyDetailSender" style="margin:0 0 4px;color:var(--orange);font-size:.82rem;font-weight:700;"></p>
        <p id="notifyDetailTime" class="meta" style="margin:0 0 10px;"></p>
        <p id="notifyDetailBody" style="margin:0;color:#d6d6d6;line-height:1.7;white-space:pre-line;"></p>
      </div>
    </article>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <span class="wordmark">WETHUS</span>
        <p class="footer-copy">학생 창업 실행 플랫폼 WETHUS<br/><a href="mailto:wethus.biz@gmail.com">wethus.biz@gmail.com</a></p>
      </div>
    </div>
  </footer>

  <script src="app.js?v=20260624-integrations-2"></script>
  <script>
    const authLink = document.querySelector('.js-auth-link');
    const st = WETHUS.getState();
    if (authLink && (st.currentUserId || st.devMode)) {
      authLink.textContent = '로그아웃';
      authLink.href = '#';
      authLink.addEventListener('click', (e) => { e.preventDefault(); WETHUS.logout(); location.href='login.html'; });
    }

    const listEl = document.getElementById('notifyList');
    const markAllBtn = document.getElementById('markAllRead');
    const detailModal = document.getElementById('notifyDetailModal');
    const summaryEl = document.getElementById('notifySummary');
    const filterMetaEl = document.getElementById('notifyFilterMeta');
    const filtersEl = document.getElementById('notifyFilters');
    let activeFilter = 'all';

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
    }

    function timeText(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function categoryForNotification(item) {
      const type = String(item?.type || '').toLowerCase();
      if (type.startsWith('plan_request')) return 'plan';
      if (type === 'review_result' || type === 'founder_submitted') return 'project';
      if (type.includes('application')) return 'team';
      return 'general';
    }

    function categoryLabel(category) {
      if (category === 'plan') return '플랜';
      if (category === 'project') return '프로젝트';
      if (category === 'team') return '팀';
      return '일반';
    }

    function typeLabel(item) {
      const type = String(item?.type || '').toLowerCase();
      if (type === 'plan_request_submitted') return '요청 접수';
      if (type === 'plan_request_approved') return '승인';
      if (type === 'plan_request_rejected') return '반려';
      if (type === 'plan_request_admin') return '운영 검토';
      if (type === 'review_result') return '검수 결과';
      if (type === 'founder_submitted') return '검수 접수';
      return '업데이트';
    }

    function openDetail(item) {
      if (!item) return;
      document.getElementById('notifyDetailType').textContent = `${categoryLabel(categoryForNotification(item)).toUpperCase()} · ${typeLabel(item).toUpperCase()}`;
      document.getElementById('notifyDetailTitle').textContent = item.title || '';
      document.getElementById('notifyDetailSender').textContent = item.sender || 'WETHUS';
      document.getElementById('notifyDetailTime').textContent = timeText(item.createdAt);
      document.getElementById('notifyDetailBody').textContent = item.body || '';
      detailModal.classList.add('open');
      detailModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeDetail() {
      detailModal.classList.remove('open');
      detailModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function previewBody(item) {
      const body = String(item?.body || '').replace(/\s+/g, ' ').trim();
      if (!body) return '';
      return body.length > 110 ? `${body.slice(0, 110)}…` : body;
    }

    function compactPreviewBody(item) {
      const body = String(item?.body || '').replace(/\s+/g, ' ').trim();
      if (!body) return '';
      if (body.includes('AI 검토 중입니다.')) {
        return 'AI 검토 중입니다. 잠시 뒤 반영 여부를 확인해보세요.';
      }
      if (body.includes('프로젝트 지원서를 확인해보세요.')) {
        return '새 팀 참여 요청이 도착했습니다. 지원서를 열어 확인해보세요.';
      }
      return body.length > 72 ? `${body.slice(0, 72)}...` : body;
    }

    function renderSummary(items) {
      const unread = items.filter((item) => item.unread).length;
      const plan = items.filter((item) => categoryForNotification(item) === 'plan').length;
      const project = items.filter((item) => categoryForNotification(item) === 'project').length;
      const cards = [
        { label: '읽지 않음', value: unread, tone: '#ffb36b', copy: unread ? '먼저 볼 항목' : '새 알림 없음' },
        { label: '플랜/검토', value: plan + project, tone: '#7dc4ff', copy: plan + project ? '결정 필요 항목' : '대기 항목 없음' }
      ];
      summaryEl.innerHTML = cards.map((card) =>         '<article class="list-item notify-summary-card" style="border-color:' + card.tone + ';">' +
          '<p class="meta" style="margin:0 0 6px;">' + esc(card.label) + '</p>' +
          '<strong style="font-size:1.35rem;">' + esc(card.value) + '</strong>' +
          '<p class="meta" style="margin:6px 0 0;">' + esc(card.copy) + '</p>' +
        '</article>'      ).join('');
    }

    function renderFilters(items) {
      const counts = {
        all: items.length,
        unread: items.filter((item) => item.unread).length,
        plan: items.filter((item) => categoryForNotification(item) === 'plan').length,
        project: items.filter((item) => categoryForNotification(item) === 'project').length,
        team: items.filter((item) => categoryForNotification(item) === 'team').length
      };
      const defs = [
        { key: 'all', label: '전체' },
        { key: 'unread', label: '읽지 않음' },
        { key: 'plan', label: '플랜' },
        { key: 'project', label: '검토' },
        { key: 'team', label: '팀' }
      ];
      if (filterMetaEl) {
        filterMetaEl.textContent = '전체 ' + counts.all + '건 · 읽지 않음 ' + counts.unread + '건 · 플랜 ' + counts.plan + '건 · 검토 ' + counts.project + '건';
      }
      filtersEl.innerHTML = defs.map((def) =>         '<button class="notify-filter-chip js-filter ' + (activeFilter === def.key ? 'active' : '') + '" type="button" data-filter="' + esc(def.key) + '">' + esc(def.label) + '</button>'      ).join('');
      filtersEl.querySelectorAll('.js-filter').forEach((button) => {
        button.addEventListener('click', () => {
          activeFilter = button.getAttribute('data-filter') || 'all';
          render();
        });
      });
    }

    function matchesFilter(item) {
      if (activeFilter === 'all') return true;
      if (activeFilter === 'unread') return !!item.unread;
      return categoryForNotification(item) === activeFilter;
    }

    function actionLink(item) {
      const href = String(item?.href || '').trim();
      if (!href) return '';
      const label = categoryForNotification(item) === 'plan' ? '플랜' : '이동';
      return `<a class="btn btn--secondary" href="${esc(href)}" style="padding:5px 10px;font-size:.75rem;">${label}</a>`;
    }

    function render(focusId) {
      const allItems = WETHUS.listNotifications(200);
      renderSummary(allItems);
      renderFilters(allItems);

      const items = allItems.filter(matchesFilter);
      if (!items.length) {
        listEl.innerHTML = '<article class="list-item"><p class="page-sub">선택한 조건에 맞는 알림이 없습니다.</p></article>';
        return;
      }

      listEl.innerHTML = items.map((item) => {
        const category = categoryForNotification(item);
        const badgeColor = category === 'plan' ? '#7dc4ff' : (category === 'project' ? '#6fdc8c' : '#ffb36b');
        return `
          <article class="list-item notify-card-shell" data-id="${esc(item.id)}" style="border-color:${item.unread ? '#ff6a00' : '#2a2a2a'};">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">
              <div>
                <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px;">
                  <span class="verify-badge" style="padding:2px 7px;background:${badgeColor};border-color:${badgeColor};color:#111;">${esc(categoryLabel(category))}</span>
                  <span class="meta">${esc(typeLabel(item))}</span>
                </div>
                <h3 class="notify-card-title">${esc(item.title)}</h3>
                <p class="notify-card-meta">${esc(item.sender || 'WETHUS')}</p>
                <p style="margin:0 0 6px;">${esc(item.body || '')}</p>
                <div class="meta notify-card-time">${esc(timeText(item.createdAt))}</div>
              </div>
              <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
                ${item.unread ? '<span class="verify-badge" style="padding:2px 7px;">NEW</span>' : '<button class="btn btn--secondary notify-delete" data-del="' + esc(item.id) + '" style="padding:3px 8px;font-size:.72rem;">삭제</button>'}
                ${actionLink(item)}
              </div>
            </div>
          </article>
        `;
      }).join('');

      listEl.querySelectorAll('.list-item[data-id]').forEach((card) => {
        card.classList.add('notify-card');
        card.querySelector(':scope > div')?.classList.add('notify-card-top');
        const actions = card.querySelector(':scope > div > div:last-child');
        if (actions) actions.classList.add('notify-card-actions');
        const body = card.querySelector('p[style*="margin:0 0 6px;"]');
        if (body) {
          body.className = 'notify-card-body';
          body.textContent = compactPreviewBody({ body: body.textContent || '' });
        }
      });

      listEl.querySelectorAll('.list-item[data-id]').forEach((el) => {
        el.addEventListener('click', (e) => {
          const delBtn = e.target.closest('.notify-delete');
          if (delBtn) {
            e.stopPropagation();
            WETHUS.removeNotification(delBtn.dataset.del);
            WETHUS.refreshNavBadges?.();
            render();
            return;
          }
          if (e.target.closest('a')) return;
          const id = el.getAttribute('data-id');
          WETHUS.markNotificationRead(id);
          WETHUS.refreshNavBadges?.();
          const picked = WETHUS.listNotifications(200).find((item) => item.id === id);
          render(id);
          openDetail(picked);
        });
      });

      if (focusId) {
        const focusEl = listEl.querySelector(`.list-item[data-id="${focusId}"]`);
        if (focusEl) {
          focusEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
          focusEl.style.boxShadow = '0 0 0 2px rgba(255,106,0,.3) inset';
          setTimeout(() => { focusEl.style.boxShadow = ''; }, 1500);
        }
      }
    }

    markAllBtn.addEventListener('click', () => {
      WETHUS.markAllNotificationsRead();
      WETHUS.refreshNavBadges?.();
      render();
    });

    document.getElementById('notifyDetailClose').addEventListener('click', closeDetail);
    detailModal.addEventListener('click', (e) => {
      if (e.target && e.target.getAttribute('data-close-notify') === 'true') closeDetail();
    });

    const qid = new URLSearchParams(location.search).get('n');
    render(qid || undefined);
    if (qid) {
      const hit = WETHUS.listNotifications(200).find((item) => item.id === qid);
      if (hit) {
        WETHUS.markNotificationRead(qid);
        WETHUS.refreshNavBadges?.();
        openDetail(hit);
      }
    }
  </script>
</body>
</html>
