  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WETHUS | 요금제</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260624-launch-ui" />
  <style>
    .pricing-wrap {
      padding: clamp(28px, 6vw, 64px) 0 52px;
    }
    .pricing-prelaunch-panel {
      max-width: 880px;
      margin: 0 auto;
      padding: clamp(24px, 5vw, 44px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      background:
        radial-gradient(circle at 16% 0%, rgba(255,123,31,.22), transparent 34%),
        linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.025));
      box-shadow: 0 28px 90px rgba(0,0,0,.34);
      text-align: center;
    }
    .pricing-prelaunch-panel h1 {
      margin: 8px 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -.05em;
    }
    .pricing-prelaunch-panel p {
      max-width: 650px;
      margin: 0 auto;
      color: var(--text-secondary);
      line-height: 1.75;
    }
    .pricing-prelaunch-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 24px;
    }
    .pricing-note {
      margin-top: 18px;
      font-size: .92rem;
      color: var(--text-muted);
    }
    @media (max-width: 640px) {
      .pricing-prelaunch-panel {
        text-align: left;
      }
      .pricing-prelaunch-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand">WETHUS</a>
      <nav class="nav">
        <a href="explore.html" class="nav-link">탐색</a>
        <a href="founder.html" class="nav-link">프로젝트 시작하기</a>
        <a href="project-hub.html" class="nav-link">프로젝트 허브</a>
        <a href="mentor.html" class="nav-link">멘토</a>
        <a href="profile.html" class="nav-link">프로필</a>
        <a href="login.html" class="nav-link js-auth-link">로그인</a>
      </nav>
    </div>
  </header>

  <main class="container page-main page-main--standard">
    <section class="pricing-wrap">
      <section class="pricing-prelaunch-panel" aria-label="요금제 준비 안내">
        <p class="section-kicker">PRICING</p>
        <h1>요금제는 아직 공개하지 않습니다</h1>
        <p>상용화 전까지 WETHUS는 무료 베타와 운영 승인 기반으로 열어둡니다. 학교, 기관, 스폰서형 플랜은 결제 기능을 열기 전에 별도 정책과 함께 공개하겠습니다.</p>
        <div class="pricing-prelaunch-actions">
          <a class="btn btn--primary" href="explore.html">프로젝트 둘러보기</a>
          <a class="btn btn--secondary" href="support.html">문의하기</a>
        </div>
        <p class="pricing-note">현재 페이지에서는 가격, 플랜 비교, 결제 요청을 노출하지 않습니다.</p>
      </section>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <span class="wordmark">WETHUS</span>
        <p class="footer-copy">학생 창업 실행 플랫폼 WETHUS<br/><a href="mailto:wethus.biz@gmail.com">wethus.biz@gmail.com</a></p>
      </div>
    </div>
  </footer>

  <script src="app.js?v=20260624-integrations-2"></script>
  <script>
    WETHUS.requireAuth();
    const authLink = document.querySelector('.js-auth-link');
    const st = WETHUS.getState();
    if (authLink && (st.currentUserId || st.devMode)) {
      authLink.textContent = '로그아웃';
      authLink.href = '#';
      authLink.addEventListener('click', (event) => {
        event.preventDefault();
        WETHUS.logout();
        location.href = 'login.html';
      });
    }
  </script>
</body>
</html>
