services:
  - type: web
    name: wethus-api
    runtime: node
    plan: free
    rootDir: WETHUS2/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@wethus.ai
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://wethus.co.kr,https://www.wethus.co.kr
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: INTEGRATION_APP_URL
        value: https://wethus-api.onrender.com
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://wethus-api.onrender.com/oauth/google/callback
      - key: GOOGLE_OAUTH_REDIRECT_URIS
        value: http://127.0.0.1:8787/oauth/google/callback,https://wethus-api.onrender.com/oauth/google/callback
      - key: GOOGLE_LOGIN_REDIRECT_URI
        value: https://wethus-api.onrender.com/auth/google/callback
      - key: GOOGLE_LOGIN_REDIRECT_URIS
        value: http://127.0.0.1:8787/auth/google/callback,https://wethus-api.onrender.com/auth/google/callback
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: NAVER_LOGIN_REDIRECT_URI
        value: https://wethus-api.onrender.com/auth/naver/callback
      - key: NAVER_LOGIN_REDIRECT_URIS
        value: http://127.0.0.1:8787/auth/naver/callback,https://wethus-api.onrender.com/auth/naver/callback
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: KAKAO_LOGIN_REDIRECT_URI
        value: https://wethus-api.onrender.com/auth/kakao/callback
      - key: KAKAO_LOGIN_REDIRECT_URIS
        value: http://127.0.0.1:8787/auth/kakao/callback,https://wethus-api.onrender.com/auth/kakao/callback
      - key: NOTION_CLIENT_ID
        sync: false
      - key: NOTION_CLIENT_SECRET
        sync: false
      - key: NOTION_REDIRECT_URI
        value: https://wethus-api.onrender.com/oauth/notion/callback
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        value: https://wethus-api.onrender.com/oauth/slack/callback
      - key: FIGMA_CLIENT_ID
        sync: false
      - key: FIGMA_CLIENT_SECRET
        sync: false
      - key: FIGMA_REDIRECT_URI
        value: https://wethus-api.onrender.com/oauth/figma/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        value: https://wethus-api.onrender.com/oauth/github/callback
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        value: https://wethus-api.onrender.com/oauth/discord/callback
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REDIRECT_URI
        value: https://wethus-api.onrender.com/oauth/google_calendar/callback
      - key: AIRTABLE_CLIENT_ID
        sync: false
      - key: AIRTABLE_CLIENT_SECRET
        sync: false
      - key: AIRTABLE_REDIRECT_URI
        value: https://wethus-api.onrender.com/oauth/airtable/callback
      - key: WETHUS_LAUNCH_PROVIDERS
        value: google_docs,google_sheets,notion,slack,figma,github,discord,google_calendar,airtable
      - key: WETHUS_DEFERRED_PROVIDERS
        value: ""
      - key: PRELAUNCH_NOTIFY_EMAIL
        value: anseokkim@gmail.com
      - key: CLOUD_STATE_REQUIRE_SESSION
        value: "true"
      - key: INTEGRATIONS_REQUIRE_ACTOR
        value: "true"
      - key: INTEGRATIONS_REQUIRE_SESSION
        value: "true"
      - key: INTEGRATIONS_ENFORCE_LAUNCH_SCOPE
        value: "true"
      - key: PROJECT_INTERACTIONS_REQUIRE_SESSION
        value: "true"
      - key: PROJECT_ACCESS_REQUIRE_MEMBERSHIP
        value: "true"
      - key: DM_REQUIRE_SESSION
        value: "true"
